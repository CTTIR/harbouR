url: https://cttir.github.io/harbouR/

template:
  includes:
    in_header: |
      <meta name="theme-color" content="#1565c0">
      <script defer data-domain="cttir.github.io/harbour" src="https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"></script>
  package: themakR

development:
  mode: auto

authors:
  R. Heller:
    href: https://orcid.org/0000-0001-8006-9742
navbar:
  bg: dark

reference:
- title: Errors
  desc: >
    Every error harbouR raises itself, and every HTTP or transport
    failure, carries a condition class, so callers can react to what went
    wrong rather than matching on message text. Argument-matching errors
    from rlang keep the classes rlang gives them.
  contents:
  - harbouR-conditions

- title: Client & authentication
  desc: Describe a server and its credentials, and check that both work.
  contents:
  - hb_client
  - hb_ping
  - hb_check_credentials
  - hb_server_info
  - print.harbour_client
  - is_harbour_client

- title: Metadata
  desc: The tables, columns and collaborators of a base, and how column types map to R.
  contents:
  - hb_metadata
  - hb_list_tables
  - hb_list_collaborators
  - hb_column_types
  - print.harbour_metadata
  - as_tibble.harbour_metadata
  - summary.harbour_metadata
  - is_harbour_metadata

- title: Rows
  desc: Read rows as a tibble, query them with SQL, and add, change, lock or delete them.
  contents:
  - hb_read_table
  - hb_query
  - hb_get_row
  - hb_append_rows
  - hb_update_rows
  - hb_delete_rows
  - hb_lock_rows
  - hb_unlock_rows

- title: Tables
  desc: Create, rename, duplicate and delete the tables of a base on a server.
  contents:
  - hb_create_table
  - hb_rename_table
  - hb_delete_table
  - hb_duplicate_table

- title: Columns
  desc: List, add, change and delete columns and the options of select columns.
  contents:
  - hb_list_columns
  - hb_add_column
  - hb_add_columns
  - hb_update_column
  - hb_delete_column
  - hb_add_select_option
  - hb_update_select_option
  - hb_delete_select_option

- title: Views
  desc: List, read, create, change and delete the views of a table.
  contents:
  - hb_list_views
  - hb_get_view
  - hb_create_view
  - hb_update_view
  - hb_delete_view

- title: Files
  desc: Upload files, attach them to a row, download them and delete them.
  contents:
  - hb_upload_file
  - hb_attach_file
  - hb_download_file
  - hb_delete_asset

- title: Local .dtable files
  desc: Read, build, check and write a base as a file, with no server involved.
  contents:
  - hb_read_dtable
  - hb_write_dtable
  - hb_dtable
  - hb_validate_dtable
  - hb_asset_path
  - is_harbour_dtable
  - print.harbour_dtable
  - names.harbour_dtable
  - length.harbour_dtable
  - as_tibble.harbour_dtable
  - summary.harbour_dtable

- title: Import and export
  desc: Convert a base to and from Excel workbooks and CSV files.
  contents:
  - hb_write_xlsx
  - hb_write_csv
  - hb_read_xlsx
  - hb_read_csv

- title: Example data
  desc: Bundled metadata and rows for trying the package offline.
  contents:
  - hb_example_metadata
  - hb_example_rows

- title: Shiny explorer
  desc: Browse a base interactively in a Shiny app.
  contents:
  - hb_run_explorer


articles:
- title: Articles
  navbar: ~
  contents:
  - harbouR
  - column-types
  - explorer-app
